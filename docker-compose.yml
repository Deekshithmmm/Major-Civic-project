services:
  db:
    image: mysql:8.0
    command:
      # Every timestamp in this system is UTC. MySQL's DATETIME carries no zone, so the server
      # is pinned to UTC and the application converts at the boundary (see app/database.py).
      # Without this, NOW() would follow the host's zone and server_default timestamps would
      # silently disagree with application-written ones.
      - --default-time-zone=+00:00
      # utf8mb4, not utf8: ward names, station names and grievance text can carry Devanagari and
      # Kannada, and MySQL's "utf8" is a 3-byte subset that cannot store every codepoint.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: civic_root_password
      MYSQL_DATABASE: civic_accountability
      # The schema owner, used by Alembic only. The application connects as a separate,
      # far weaker user created in docker/mysql-init - see README, "Two database users".
      MYSQL_USER: civic_migrate
      MYSQL_PASSWORD: civic_migrate_password
    # Host port 3307: a locally-installed MySQL commonly already holds 3306 on dev machines.
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pcivic_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  # quay.io, not Docker Hub: MinIO no longer publishes a `latest` tag to docker.io/minio/minio.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: civic_minio
      MINIO_ROOT_PASSWORD: civic_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # A browser-based database client, at http://localhost:8080.
  #
  # Development only. It is a full database administration console with no access control of its
  # own beyond the MySQL login, so it must never be started anywhere reachable from a network you
  # do not control. It is in this file rather than in a developer's own tooling because "open the
  # schema and look at it" is something a reviewer of this project will want to do without
  # installing anything.
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      # Pre-fills the server field, so the only thing to type is the username and password.
      ADMINER_DEFAULT_SERVER: db
    volumes:
      # Adminer loads a file of this name automatically. It restyles the console to match the
      # application's own interface and, more usefully, makes a wide table readable: the header
      # row sticks, rows stripe and highlight on hover, and the hit targets grow.
      - ./docker/adminer/adminer.css:/var/www/html/adminer.css:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
