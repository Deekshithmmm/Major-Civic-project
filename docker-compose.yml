services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic_dev_password
      POSTGRES_DB: civic_accountability
    # Host port 5433: a locally-installed Postgres commonly already holds 5432 on dev machines.
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic_accountability"]
      interval: 5s
      timeout: 5s
      retries: 10

  # quay.io, not Docker Hub: MinIO no longer publishes a `latest` tag to docker.io/minio/minio.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: civic_minio
      MINIO_ROOT_PASSWORD: civic_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
  minio_data:
